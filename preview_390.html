<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>390 미리보기</title>
<style>html,body{margin:0;padding:0;background:#ffffff}iframe{width:390px;height:844px;border:0;display:block}</style>
</head><body>
<iframe id="f" src="preview_cool.html"></iframe>
<script>
var y = +(new URLSearchParams(location.search).get('y') || 0);

document.getElementById('f').addEventListener('load', function(){ go(); setTimeout(go, 300); });
</script>
