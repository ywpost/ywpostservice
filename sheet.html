<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>견적기 5단계 화면</title>
<style>
  html,body{margin:0;background:#F1ECE4;font:13px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#1E293B}
  .wrap{display:flex;gap:14px;padding:18px 20px 24px;align-items:flex-start}
  .col{width:351px}
  .cap{font-weight:800;font-size:14px;letter-spacing:-.02em;margin:0 0 8px 2px;color:#1E293B}
  .cap span{color:#E85D04;margin-right:5px}
  .ph{width:390px;height:844px;border:0;transform:scale(.9);transform-origin:top left;border-radius:14px;
      box-shadow:0 6px 22px rgba(30,41,59,.14);background:#fff;overflow:hidden}
  .hold{width:351px;height:760px;overflow:hidden;border-radius:14px}
</style></head>
<body>
<div class="wrap" id="wrap"></div>
<script>
var STEPS=[
  ['1','나라','s1'],
  ['2','물건','s2'],
  ['3','상자','s3'],
  ['4','요금','s4'],
  ['5','접수','s5']
];
var wrap=document.getElementById('wrap');
STEPS.forEach(function(s){
  var col=document.createElement('div');col.className='col';
  col.innerHTML='<p class="cap"><span>'+s[0]+'</span>'+s[1]+'</p><div class="hold"><iframe class="ph" src="./index.html?v=1"></iframe></div>';
  wrap.appendChild(col);
});
var frames=[].slice.call(document.querySelectorAll('iframe'));
var ready=0;
frames.forEach(function(f,i){
  f.addEventListener('load',function(){
    ready++;
    if(ready<frames.length)return;
    frames.forEach(function(fr,i){
      var w=fr.contentWindow;
      try{
        var A=w.__app;
        A.S.country='미국';A.S.items=['kim'];A.S.box='b3';A.S.kg=3;
        if(i===3||i===4)A.S.method='ems';
        if(i===4){
          var d=w.document;
          d.getElementById('fName').value='KIM MINSU';
          d.getElementById('fTel').value='650 555 0142';
          d.getElementById('fMail').value='mkim@example.com';
          d.getElementById('fA1').value='1600 Amphitheatre Parkway';
          d.getElementById('fCity').value='Mountain View';
          d.getElementById('fState').value='CA';
          d.getElementById('fZip').value='94043';
        }
        A.go(i+1);
        if(i===4){A.validate();}
        w.scrollTo(0,0);
      }catch(e){console.log('err',i,e)}
    });
  });
});
</script>
</body></html>
